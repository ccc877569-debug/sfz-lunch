<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>順豐棧 · 午餐點餐</title>
<style>
:root{ --blue:#1f9cd8; --blue2:#0f7fb5; --pink:#fdeeed; --green:#0b6e4f; --wabg:#005c4b; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{margin:0; background:#f4efe9; font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","PingFang HK","Microsoft JhengHei","Noto Sans TC",sans-serif; color:#222;}
.app{max-width:520px; margin:0 auto; padding:16px 14px 120px;}
h1{font-size:21px; margin:0 0 4px; color:#8c2f2f;}
.sub{font-size:12px; color:#8a7f78; margin-bottom:14px; line-height:1.5;}
.card{background:#fff; border-radius:14px; padding:12px 14px; margin-bottom:12px; box-shadow:0 1px 5px rgba(90,60,40,.08);}
.lbl{font-size:13px; font-weight:700; color:#555; margin-bottom:8px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.hint{font-size:12px; color:#a0948c; font-weight:400;}
.row2{display:flex; gap:8px;}
input[type=text]{width:100%; padding:9px 10px; border:1px solid #e3d9d2; border-radius:9px; font-size:15px; background:#fbf8f6; font-family:inherit;}
input[type=text]:focus{outline:2px solid var(--blue); border-color:var(--blue);}
.chips{display:flex; flex-wrap:wrap; gap:6px;}
.chip{padding:7px 11px; border-radius:999px; background:#f3ebe6; border:1px solid #e7dcd4; font-size:13.5px; cursor:pointer; user-select:none; line-height:1.2;}
.chip.on{background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600;}
.chip.dis{background:var(--wabg); border-color:var(--wabg); color:#fff; font-weight:600;}
.letters{display:grid; grid-template-columns:repeat(5,1fr); gap:7px;}
.letters .chip{padding:13px 0; text-align:center; font-weight:800; font-size:19px; border-radius:11px;}
.step{background:#faf6f2; border:1px solid #efe5de; border-radius:11px; padding:10px 10px 11px; margin-top:9px;}
.slbl{font-size:11px; font-weight:700; color:#a0948c; letter-spacing:1.5px; margin-bottom:7px; display:flex; align-items:center; gap:6px;}
.sn{flex:none; width:16px; height:16px; border-radius:50%; background:var(--blue); color:#fff; font-size:10.5px; font-weight:700; display:flex; align-items:center; justify-content:center; letter-spacing:0;}
.selline{background:#eaf4ef; color:#0b6e4f; border-radius:9px; padding:8px 11px; font-size:14px; font-weight:600; margin:8px 0 0;}
.selline.none{display:none;}
.pline{display:flex; align-items:center; gap:10px; font-size:17px; line-height:1.5; color:#fff; border-radius:9px; padding:3px 6px; margin:1px -6px; cursor:pointer;}
.pline.sel{background:rgba(255,255,255,.15); box-shadow:inset 3px 0 0 #ffd75e;}
.ptxt{flex:1; word-break:break-all;}
.pdel{flex:none; width:27px; height:27px; border-radius:50%; border:1px solid rgba(255,255,255,.32); background:rgba(0,0,0,.24); color:#ffecec; font-size:13.5px; font-weight:700; display:flex; align-items:center; justify-content:center; cursor:pointer;}
.mini{border:1px solid #e0d5cd; background:#faf6f3; border-radius:999px; padding:5px 12px; font-size:12.5px; cursor:pointer; color:#555;}
.mini.primary{background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600;}
.cellbox{border-radius:10px; overflow:hidden; background:#fff; border:1px solid #eee;}
.cellbox .crop{position:relative; overflow:hidden; background:#fff;}
.cellbox img{position:absolute; max-width:none; display:block;}
.center{text-align:center;}
.wabubble{background:var(--wabg); border-radius:16px 16px 4px 16px; padding:13px 15px 8px; box-shadow:0 1px 4px rgba(0,0,0,.15);}
.waline{font-size:17px; line-height:1.55; color:#fff; word-break:break-word;}
.waline.dim{color:rgba(255,255,255,.55); font-size:14.5px;}
.gap{height:9px;}
.stamp{text-align:right; color:#8fd9bd; font-size:12px; margin-top:8px;}
#summary{margin-top:9px;}
.footbar{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:520px; display:flex; gap:9px; padding:10px 14px calc(12px + env(safe-area-inset-bottom)); background:rgba(255,255,255,.94); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 -2px 12px rgba(0,0,0,.08); z-index:50;}
.footbar button{flex:1; border:none; border-radius:12px; padding:14px 8px; font-size:16px; font-weight:700; cursor:pointer; font-family:inherit;}
.wa{background:#fff; color:#0b6e4f; border:2px solid #0b6e4f !important;}
.copy{background:#0b6e4f; color:#fff;}
.copy:disabled{opacity:.45;}
.toast{position:fixed; left:50%; bottom:100px; transform:translateX(-50%) translateY(20px); background:rgba(20,60,45,.95); color:#fff; padding:11px 22px; border-radius:999px; font-size:15px; opacity:0; pointer-events:none; transition:all .25s; z-index:99;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.modal{position:fixed; inset:0; background:rgba(15,20,25,.92); z-index:100; display:none;}
.modal.open{display:block;}
.mscroll{position:absolute; inset:0; overflow:auto; -webkit-overflow-scrolling:touch;}
.mscroll img{width:100%; display:block;}
.mscroll img.big{width:2200px; max-width:none;}
.mclose{position:fixed; top:14px; right:16px; z-index:101; width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,.9); color:#333; font-size:20px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-weight:700;}
.mtip{position:fixed; bottom:18px; left:50%; transform:translateX(-50%); color:#fff; background:rgba(0,0,0,.55); padding:7px 14px; border-radius:999px; font-size:12.5px; z-index:101; white-space:nowrap;}
.empty{color:#b5a99f; font-size:13.5px; padding:6px 2px;}
</style>
</head>
<body>
<div class="app">
  <h1>🍲 順豐棧 · 午餐點餐</h1>

  <div class="card">
    <div class="lbl">學校 ＋ 班別</div>
    <div class="row2">
      <input type="text" id="school" placeholder="學校名">
      <input type="text" id="cls" placeholder="班別" style="max-width:120px;">
    </div>
  </div>

  <div class="card">
    <div class="lbl">日期 <span class="hint" id="dateNote"></span></div>
    <div class="chips" id="dateChips"></div>
  </div>

  <div class="card">
    <div class="lbl">當日餐單 <button class="mini" id="zoomBtn">🔍 放大睇全張</button></div>
    <div class="cellbox" id="cellBox"></div>
  </div>

  <div class="card">
    <div class="lbl">落單<span class="hint" id="cntNote" style="margin-left:auto;"></span></div>
    <div class="step">
      <div class="slbl"><span class="sn">1</span>選餐</div>
      <div class="letters" id="letters"></div>
      <div class="selline" id="selLine"></div>
    </div>
    <div class="step">
      <div class="slbl"><span class="sn">2</span>飲品</div>
      <div class="chips" id="drinkChips"></div>
    </div>
    <div class="step">
      <div class="slbl"><span class="sn">3</span>甜度</div>
      <div class="chips" id="modChips"></div>
    </div>
    <div class="wabubble"><div id="lines"></div><div class="stamp" id="stamp"></div></div>
    <div class="hint" id="summary"></div>
  </div>
</div>

<div class="footbar">
  <button class="wa" id="waBtn">WhatsApp 發送</button>
  <button class="copy" id="copyBtn">📋 複製 order</button>
</div>

<div class="toast" id="toast">已複製 ✓</div>
<div class="modal" id="modal">

const CELLS = [{"dates":["2/10","3/10"],"x":58,"y":403,"w":358,"h":379},{"dates":["5/10"],"x":424,"y":403,"w":360,"h":379},{"dates":["6/10"],"x":792,"y":403,"w":358,"h":379},{"dates":["7/10"],"x":1158,"y":403,"w":360,"h":379},{"dates":["8/10"],"x":1525,"y":403,"w":358,"h":379},{"dates":["9/10","10/10"],"x":58,"y":790,"w":358,"h":364},{"dates":["12/10"],"x":424,"y":790,"w":360,"h":364},{"dates":["13/10"],"x":792,"y":790,"w":358,"h":364},{"dates":["14/10"],"x":1158,"y":790,"w":360,"h":364},{"dates":["15/10"],"x":1525,"y":790,"w":358,"h":364},{"dates":["16/10"],"x":58,"y":1162,"w":358,"h":380},{"dates":["20/10"],"x":424,"y":1162,"w":360,"h":380},{"dates":["21/10"],"x":792,"y":1162,"w":358,"h":380},{"dates":["22/10"],"x":1158,"y":1162,"w":360,"h":380},{"dates":["23/10","24/10"],"x":1525,"y":1162,"w":358,"h":380},{"dates":["26/10"],"x":58,"y":1550,"w":358,"h":361},{"dates":["27/10"],"x":424,"y":1550,"w":360,"h":361},{"dates":["28/10"],"x":792,"y":1550,"w":358,"h":361},{"dates":["29/10"],"x":1158,"y":1550,"w":360,"h":361},{"dates":["30/10","31/10"],"x":1525,"y":1550,"w":358,"h":361}];
const LETTERS = 'ABCDEFGHIJ'.split('');
const DRINKS = ['凍奶茶','熱奶茶','凍檸茶','凍檸水','熱檸茶','凍咖啡','熱咖啡','凍華田','熱華田'];
const MODS = ['','走甜','少甜'];
const WA_NUM = '85259902668';
const $ = id => document.getElementById(id);

/* ---------- 資料 ---------- */
let store = {school:'荔景天主教中學', cls:'6A04', byDate:{}, dts:{}, mts:0};
try{ const s = JSON.parse(localStorage.getItem('sfz_order_v1')); if(s && s.byDate) store = s; }catch(e){}
function norm(s){
  s = (s && typeof s === 'object' && !Array.isArray(s)) ? s : {};
  if(!s.byDate || typeof s.byDate !== 'object' || Array.isArray(s.byDate)) s.byDate = {};
  if(!s.dts || typeof s.dts !== 'object' || Array.isArray(s.dts)) s.dts = {};
  return s;
}
store = norm(store);
function saveLocal(){ try{ localStorage.setItem('sfz_order_v1', JSON.stringify(store)); }catch(e){} }
function save(){ saveLocal(); scheduleSync(); }
function touchDate(){ store.dts[curDate] = Date.now(); }
function touchMeta(){ store.mts = Date.now(); }
function orders(){ return store.byDate[curDate] || (store.byDate[curDate] = []); }

/* ---------- 雲端同步：所有人睇到同一份 order（靜態頁用 textdb.dev 做共享儲存） ---------- */
const SYNC_URL = 'https://textdb.dev/api/data/sfz-lunch-2026-x4tj9m';
let lastRemote = 0, syncTimer = null, syncBusy = false, pendingPush = false, remoteFresh = false;
function mergeStores(local, remote){
  const L = norm(JSON.parse(JSON.stringify(norm(local)))), R = norm(remote);
  const out = { byDate:{}, dts:{}, school:L.school, cls:L.cls, mts:0 };
  new Set([...Object.keys(L.byDate), ...Object.keys(R.byDate)]).forEach(d => {
    const lt = L.dts[d] || 0, rt = R.dts[d] || 0;
    if(R.byDate[d] && rt >= lt){ out.byDate[d] = R.byDate[d]; out.dts[d] = rt; }
    else if(L.byDate[d]){ out.byDate[d] = L.byDate[d]; out.dts[d] = lt; }
  });
  if((R.mts||0) > (L.mts||0) && R.school){ out.school = R.school; out.cls = R.cls; }
  out.mts = Math.max(L.mts||0, R.mts||0);
  return out;
}
async function pull(){
  const r = await fetch(SYNC_URL + '?t=' + Date.now(), { cache:'no-store' });
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const txt = (await r.text()).trim();
  if(!txt){ remoteFresh = true; return; }
  const remote = norm(JSON.parse(txt));
  remoteFresh = !Object.keys(remote.byDate).length;
  const ra = remote.updatedAt || 0;
  if(ra && ra === lastRemote) return;
  lastRemote = ra;
  const merged = mergeStores(store, remote);
  if(JSON.stringify(merged) !== JSON.stringify(norm(store))){ store = merged; saveLocal(); renderAll(); }
}
async function push(){
  let remote = null;
  try{
    const r = await fetch(SYNC_URL + '?t=' + Date.now(), { cache:'no-store' });
    if(r.ok){ const txt = (await r.text()).trim(); if(txt) remote = norm(JSON.parse(txt)); }
  }catch(e){}
  const merged = mergeStores(store, remote || {});
  merged.updatedAt = Date.now();
  lastRemote = merged.updatedAt;
  const r = await fetch(SYNC_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(merged) });
  if(!r.ok) throw new Error('HTTP ' + r.status);
  store = merged; saveLocal(); renderAll();
}
function scheduleSync(){ pendingPush = true; clearTimeout(syncTimer); syncTimer = setTimeout(() => sync(true), 700); }
async function sync(pushLocal){
  if(syncBusy){ if(pushLocal) pendingPush = true; return; }
  syncBusy = true;
  try{
    if(pushLocal){ pendingPush = false; await push(); }
    else await pull();
  }finally{
    syncBusy = false;
    if(pendingPush){ pendingPush = false; syncTimer = setTimeout(() => sync(true), 300); }
  }
}

/* ---------- 日期 ---------- */
function parseDM(s){ const [d,m] = s.split('/').map(Number); return new Date(2026, m-1, d); }
function wk(s){ return '日一二三四五六'[parseDM(s).getDay()]; }
const ALLDATES = [];
CELLS.forEach(c => c.dates.forEach(d => ALLDATES.push(d)));
ALLDATES.sort((a,b)=>parseDM(a)-parseDM(b));
let curDate = null;
(function pickDate(){
  const t = new Date(); t.setDate(t.getDate()+1);
  const key = t.getDate()+'/'+(t.getMonth()+1);
  if(ALLDATES.includes(key)){ curDate = key; return; }
  curDate = ALLDATES.find(d => parseDM(d) >= t) || ALLDATES[0];
  $('dateNote').textContent = '聽日（'+key+'）冇餐，幫你揀咗下一日';
})();

/* ---------- 日期 chips ---------- */
function renderDates(){
  const box = $('dateChips'); box.innerHTML = '';
  ALLDATES.forEach(d => {
    const c = document.createElement('div');
    c.className = 'chip' + (d===curDate?' on':'');
    c.textContent = d + ' (' + wk(d) + ')';
    c.onclick = () => { curDate = d; selIdx = orders().length - 1; $('dateNote').textContent=''; renderAll(); };
    box.appendChild(c);
  });
}

/* ---------- 當日餐單（用同一張圖 CSS 裁切） ---------- */
const SRC = $('fullImg').src;
function renderCell(){
  const cell = CELLS.find(c => c.dates.includes(curDate));
  const box = $('cellBox'); box.innerHTML = '';
  if(!cell){ box.innerHTML = '<div class="empty center" style="padding:20px">呢日冇餐單</div>'; return; }
  const crop = document.createElement('div');
  crop.className = 'crop';
  crop.style.aspectRatio = cell.w + ' / ' + cell.h;
  const img = document.createElement('img');
  img.src = SRC; img.alt = curDate + ' 餐單';
  img.style.width = 'calc(100% * ' + IMGW + ' / ' + cell.w + ')';
  img.style.left  = 'calc(-100% * ' + cell.x + ' / ' + cell.w + ')';
  img.style.top   = 'calc(-100% * ' + cell.y + ' / ' + cell.h + ')';
  crop.appendChild(img); box.appendChild(crop);
}

/* ---------- 落單（一個揀區；預覽每行後有 ✕ 刪單） ---------- */
let selIdx = -1;
function sel(){ const os = orders(); return (selIdx >= 0 && selIdx < os.length) ? os[selIdx] : null; }

function renderPicker(){
  const lb = $('letters'); lb.innerHTML = '';
  LETTERS.forEach(L => {
    const c = document.createElement('div');
    c.className = 'chip'; c.textContent = L;
    c.onclick = () => { touchDate(); orders().push({letter:L, base:'', mod:''}); selIdx = orders().length - 1; save(); renderAll(); };
    lb.appendChild(c);
  });
  const o = sel(), sl = $('selLine');
  if(o){ sl.className = 'selline'; sl.textContent = '✎ 改緊：' + lineOf(o); }
  else { sl.className = 'selline none'; sl.textContent = ''; }

  const db = $('drinkChips'); db.innerHTML = '';
  const drinks = [['','無']].concat(DRINKS.map(v => [v,v]));
  drinks.forEach(([v,t]) => {
    const c = document.createElement('div');
    c.className = 'chip' + (o && o.base === v ? ' on' : '');
    c.textContent = t;
    c.onclick = () => {
      if(!sel()){ toast('先撳字母（A–J）落一個 order'); return; }
      sel().base = v; if(!v) sel().mod = '';
      touchDate(); save(); renderAll();
    };
    db.appendChild(c);
  });
  const mb = $('modChips'); mb.innerHTML = '';
  MODS.forEach(m => {
    const c = document.createElement('div');
    const ok = !!(o && o.base);
    c.className = 'chip' + (ok && o.mod === m ? ' on' : '') + (ok ? '' : ' dis');
    c.textContent = m || '原味';
    c.onclick = () => {
      if(!sel()){ toast('先撳字母（A–J）落一個 order'); return; }
      if(!sel().base){ toast('呢行冇飲品，唔使揀甜度'); return; }
      sel().mod = m; touchDate(); save(); renderAll();
    };
    mb.appendChild(c);
  });
}
function renderPreview(){
  const box = $('lines'); box.innerHTML = '';
  const head = (($('school').value||'').trim() + ' ' + ($('cls').value||'').trim()).trim();
  const mk = (txt, cls) => { const d = document.createElement('div'); d.className = cls || 'waline'; d.textContent = txt; box.appendChild(d); };
  mk(head || '（學校＋班別）'); mk(curDate); mk('', 'gap');
  const os = orders();
  if(!os.length){ mk('（未落單 — 撳上面 A–J 就即刻加單）', 'waline dim'); return; }
  os.forEach((o, i) => {
    const row = document.createElement('div');
    row.className = 'pline' + (i === selIdx ? ' sel' : '');
    const tx = document.createElement('div'); tx.className = 'ptxt'; tx.textContent = lineOf(o);
    const del = document.createElement('div'); del.className = 'pdel'; del.textContent = '✕';
    row.append(tx, del);
    row.onclick = () => { selIdx = i; renderAll(); };
    del.onclick = e => { e.stopPropagation(); os.splice(i,1); if(selIdx > i) selIdx--; else if(selIdx >= os.length) selIdx = os.length - 1; touchDate(); save(); renderAll(); };
    box.appendChild(row);
  });
}
function lineOf(o){
  const drink = o.base ? (o.base + (o.mod||'')) : '';
  return drink ? o.letter + '+ ' + drink : o.letter;
}

/* ---------- 預覽 ＋ 複製 ---------- */
function buildText(){
  const head = (($('school').value||'').trim() + ' ' + ($('cls').value||'').trim()).trim();
  const lines = [head, curDate, ''];
  orders().forEach(o => lines.push(lineOf(o)));
  return lines.join('\n');
}
function updatePreview(){
  const os = orders();
  $('cntNote').textContent = os.length ? '（' + os.length + ' 個 order）' : '';
  const n = new Date(), h = n.getHours();
  const ampm = (h<6||h>=12) ? (h>=12?'下午':'凌晨') : '上午';
  $('stamp').textContent = ampm + ' ' + (h%12||12) + ':' + String(n.getMinutes()).padStart(2,'0') + ' ✓✓';
  const drinks = os.filter(o=>o.base).length;
  if(os.length){
    const per = 42 - 1 - (os.length>=4 ? 2 : 0);
    $('summary').textContent = '共 ' + os.length + ' 個餐・' + drinks + ' 杯飲品 ・ 估計 $' + (os.length*per + drinks*3)
      + '（' + os.length + '餐×$' + per + (drinks ? ' + ' + drinks + '飲品×$3' : '') + '，學生−$1' + (os.length>=4 ? '、4個以上再−$2' : '') + '，只作參考）';
  } else { $('summary').textContent = ''; }
  $('copyBtn').disabled = !os.length;
}
function renderAll(){ renderDates(); renderCell(); renderPicker(); renderPreview(); updatePreview(); }

/* ---------- 事件 ---------- */
$('school').value = store.school || '荔景天主教中學';
$('cls').value = store.cls || '6A04';
$('school').oninput = $('cls').oninput = () => { store.school=$('school').value; store.cls=$('cls').value; touchMeta(); save(); renderPreview(); updatePreview(); };

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800); }
$('copyBtn').onclick = async () => {
  const t = buildText();
  try{ await navigator.clipboard.writeText(t); }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  toast('已複製 ✓ 貼去 WhatsApp就得');
};
$('waBtn').onclick = () => {
  window.open('https://wa.me/' + WA_NUM + '?text=' + encodeURIComponent(buildText()), '_blank');
};
/* 全張餐單 */
const modal=$('modal'), mimg=$('fullImg');
$('zoomBtn').onclick = () => { modal.classList.add('open'); mimg.classList.remove('big'); $('mscroll').scrollTop=0; };
$('mclose').onclick = () => modal.classList.remove('open');
mimg.onclick = () => { mimg.classList.toggle('big'); if(mimg.classList.contains('big')) mimg.scrollIntoView({block:'nearest'}); };
modal.addEventListener('click', e => { if(e.target===$('mscroll')) modal.classList.remove('open'); });

selIdx = orders().length - 1;
renderAll();

/* ---------- 同步啟動：開頁即拉 → 雲端空就上種子 → 每 5 秒輪詢 ---------- */
sync(false).then(() => { if(remoteFresh && Object.keys(store.byDate).length) sync(true); });
setInterval(() => { if(!document.hidden) sync(false); }, 5000);
document.addEventListener('visibilitychange', () => { if(!document.hidden) sync(false); });
window.addEventListener('online', () => sync(true));
</script>
</body>
